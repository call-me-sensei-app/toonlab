<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 27 7 11l7-6 8 3 6 19Z' fill='%23a9613c'/%3E%3C/svg%3E" />
    <title>Rock geology v2 · C11 production scene proof</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #82b8db; }
      canvas { display: block; width: 100%; height: 100%; }
      #controls, #status {
        position: fixed; z-index: 3; border: 1px solid rgba(255,255,255,.2);
        border-radius: 10px; background: rgba(18,26,34,.74); backdrop-filter: blur(9px);
      }
      #controls { left: 18px; top: 18px; display: flex; gap: 8px; padding: 8px; }
      #status { left: 18px; bottom: 18px; max-width: calc(100vw - 36px); padding: 9px 12px; color: #eef6ff; font-size: 12px; }
      button { border: 1px solid rgba(255,255,255,.2); border-radius: 7px; padding: 8px 11px; background: #253440; color: #e6f0f8; cursor: pointer; }
      button[aria-pressed="true"] { background: #b85e32; color: white; }
      body[data-hud="false"] #controls, body[data-hud="false"] #status { display: none; }
    </style>
  </head>
  <body data-ready="false">
    <main id="stage" aria-label="C11 production scene rock proof"></main>
    <nav id="controls" aria-label="Rock stylization state">
      <button type="button" data-rock-mode="neutral">Neutral</button>
      <button type="button" data-rock-mode="styled">Styled</button>
      <button type="button" data-rock-mode="restored">Restore</button>
    </nav>
    <div id="status">Loading shared ToonLab scene systems…</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
