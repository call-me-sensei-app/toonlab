<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock geology v2 · C11 stylization proof</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body, #stage { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #11171e; }
      canvas { display: block; width: 100%; height: 100%; }
      #status {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 2;
        max-width: calc(100vw - 36px);
        padding: 8px 12px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 8px;
        background: rgba(10,14,19,.72);
        color: #dce5ef;
        font-size: 12px;
        letter-spacing: .02em;
        backdrop-filter: blur(8px);
      }
      body[data-hud="false"] #status { display: none; }
      #controls {
        position: fixed;
        left: 18px;
        top: 18px;
        z-index: 3;
        display: flex;
        gap: 8px;
        padding: 8px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 10px;
        background: rgba(10,14,19,.74);
        backdrop-filter: blur(8px);
      }
      #controls button {
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 7px;
        padding: 8px 11px;
        background: #202b36;
        color: #dce5ef;
        cursor: pointer;
      }
      #controls button[aria-pressed="true"] { background: #b85e32; color: white; }
      body[data-hud="false"] #controls { display: none; }
    </style>
  </head>
  <body data-model-ready="false">
    <main id="stage" aria-label="C11 reversible rock stylization proof"></main>
    <nav id="controls" aria-label="Rock stylization state">
      <button type="button" data-rock-mode="neutral">Neutral</button>
      <button type="button" data-rock-mode="styled">Styled</button>
      <button type="button" data-rock-mode="restored">Restore</button>
    </nav>
    <div id="status">Loading canonical hoodoo…</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
