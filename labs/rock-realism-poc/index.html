<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realistic rock methodology proof · ToonLab</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #aeb5b7;
        color: #f4f6f7;
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 2;
        width: min(370px, calc(100vw - 28px));
        padding: 13px 15px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 10px;
        background: rgba(18, 22, 24, 0.86);
        box-shadow: 0 12px 38px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(9px);
      }
      body[data-hud='false'] #hud { display: none; }
      h1 { margin: 0 0 2px; font-size: 14px; }
      .eyebrow { margin: 0 0 10px; color: #aebbc0; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; }
      nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
      nav a {
        color: #dce6e8;
        text-decoration: none;
        padding: 4px 7px;
        border-radius: 5px;
        border: 1px solid rgba(255,255,255,.14);
        background: rgba(255,255,255,.06);
      }
      nav a:hover { background: rgba(255,255,255,.13); }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
      dt { color: #9eacb1; }
      dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        background: #aeb5b7;
        color: #293235;
        font-weight: 650;
        letter-spacing: .02em;
      }
      body[data-rock-ready='true'] #loading { display: none; }
      body[data-rock-error] #loading { color: #7b1d1d; padding: 32px; text-align: center; }
    </style>
  </head>
  <body data-hud="true">
    <div id="stage"></div>
    <aside id="hud">
      <p class="eyebrow">Repository-only experiment</p>
      <h1>Realistic rock methodology proof</h1>
      <nav id="seedLinks" aria-label="Deterministic seeds"></nav>
      <dl id="hudFields"></dl>
    </aside>
    <div id="loading">Evaluating geological field…</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
