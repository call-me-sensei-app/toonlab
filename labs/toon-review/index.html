<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Toon Review</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1b1f; color: #e8e8ea; font: 12px/1.45 ui-monospace, monospace; }
      #stage { position: fixed; inset: 0; display: flex; align-items: stretch; justify-content: center; gap: 0; }
      #stage canvas { display: block; }
      #stage img { display: block; object-fit: contain; }
      #status { position: fixed; left: 8px; bottom: 8px; white-space: pre; z-index: 2; text-shadow: 0 1px 2px #000; pointer-events: none; }
      .label { position: fixed; top: 6px; z-index: 2; padding: 2px 6px; background: rgba(0, 0, 0, 0.55); border-radius: 3px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="status">loading…</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
