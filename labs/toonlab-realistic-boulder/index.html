<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToonLab realistic boulder compiler · repository-only</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #c3c6c1; }
      canvas { display: block; width: 100%; height: 100%; }
      #title, #hud {
        position: fixed; z-index: 2; color: #f4f1e8; background: rgba(22, 25, 23, 0.78);
        border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(12px); border-radius: 10px;
      }
      #title { top: 16px; left: 16px; padding: 11px 14px; }
      #title strong { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
      #title span { display: block; color: #c8c9c0; margin-top: 3px; font-size: 11px; }
      #hud { right: 16px; bottom: 16px; width: min(360px, calc(100vw - 32px)); padding: 12px 14px; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 3; color: #292c29; font-weight: 650; letter-spacing: .03em; }
      body[data-rock-ready='true'] #loading { display: none; }
      body[data-rock-error] #loading { color: #7a2222; padding: 32px; text-align: center; }
      body[data-hud='0'] #title, body[data-hud='0'] #hud { display: none; }
    </style>
  </head>
  <body>
    <div id="loading">Loading ToonLab-compiled boulder…</div>
    <div id="title"><strong>Jointed granite boulder v1</strong><span>ToonLab-owned compiler · repository-only</span></div>
    <pre id="hud"></pre>
    <script type="module" src="./main.js"></script>
  </body>
</html>
