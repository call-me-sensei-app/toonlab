<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToonLab rock family bake matrix · repository-only</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #b9bfbc; }
      canvas { display: block; width: 100%; height: 100%; }
      #title, #hud, .comparison-label {
        position: fixed; z-index: 2; color: #f3f0e7; background: rgba(21, 24, 22, .78);
        border: 1px solid rgba(255,255,255,.14); border-radius: 10px; backdrop-filter: blur(12px);
      }
      #title { top: 16px; left: 16px; padding: 10px 14px; }
      #title strong { display: block; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; }
      #title span { display: block; margin-top: 3px; color: #c9cbc3; font-size: 11px; }
      #hud { right: 16px; bottom: 16px; width: min(370px, calc(100vw - 32px)); padding: 11px 14px; font: 11px/1.48 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
      .comparison-label { bottom: 22px; padding: 7px 12px; font-size: 12px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; transform: translateX(-50%); }
      #before-label { left: 27%; }
      #after-label { left: 73%; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 4; color: #252925; font-weight: 700; }
      body[data-rock-ready='true'] #loading { display: none; }
      body[data-rock-error] #loading { color: #7b2020; padding: 32px; text-align: center; }
      body[data-compare='0'] .comparison-label, body[data-hud='0'] #title, body[data-hud='0'] #hud { display: none; }
      body[data-compare='1'][data-hud='0'] .comparison-label { display: block; }
    </style>
  </head>
  <body>
    <div id="loading">Loading compiled family comparison…</div>
    <div id="title"><strong id="family-title">Rock family</strong><span id="family-subtitle">ToonLab high-to-low qualification</span></div>
    <div id="before-label" class="comparison-label">Before · low mesh</div>
    <div id="after-label" class="comparison-label">After · baked</div>
    <pre id="hud"></pre>
    <script type="module" src="./main.js"></script>
  </body>
</html>
