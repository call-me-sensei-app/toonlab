<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stillwater Garden trees · Gate 1 review · ToonLab</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #10131a; }
      body { font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; color: #e8edf5; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 2;
        padding: 10px 13px; border-radius: 9px;
        background: rgba(12, 15, 21, 0.82);
        border: 1px solid rgba(150, 172, 205, 0.24);
        backdrop-filter: blur(7px);
        max-width: 380px;
      }
      body[data-hud='false'] #hud { display: none; }
      #hud h1 { margin: 0 0 6px; font-size: 13px; letter-spacing: 0.02em; }
      #hud dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
      #hud dt { color: #93a4bd; }
      #hud dd { margin: 0; font-variant-numeric: tabular-nums; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #10131a; z-index: 3; color: #93a4bd;
      }
      body[data-model-ready='true'] #loading { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">
      <h1>Stillwater Garden · trees</h1>
      <dl id="hudFields"></dl>
    </div>
    <div id="loading">building trees…</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
