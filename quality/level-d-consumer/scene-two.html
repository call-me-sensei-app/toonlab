<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToonLab clean-room scene two</title>
  <style>
    :root { color-scheme: dark; font: 13px/1.35 Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body, #scene { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #78c8ed; }
    canvas { display: block; width: 100%; height: 100%; }
    .panel {
      position: fixed; z-index: 10; padding: 14px; border: 1px solid rgb(255 255 255 / 22%);
      border-radius: 12px; background: rgb(20 34 48 / 88%); box-shadow: 0 12px 34px rgb(0 0 0 / 25%);
      backdrop-filter: blur(12px);
    }
    #panel { inset: 14px auto auto 14px; width: 340px; max-height: calc(100% - 28px); overflow: auto; }
    #controls { inset: auto auto 14px 14px; color: #cfe0ec; }
    h1 { margin: 0 0 3px; font-size: 16px; }
    .subtitle { margin: 0 0 11px; color: #9fb5c5; font-size: 11px; }
    .grid { display: grid; grid-template-columns: 88px 1fr; gap: 7px 10px; align-items: center; }
    label { color: #cfe0ec; }
    select { min-width: 0; padding: 5px 7px; border: 1px solid rgb(255 255 255 / 22%); border-radius: 6px; color: #f5fbff; background: #243c50; font: inherit; }
    #domains { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgb(255 255 255 / 16%); }
    .domain { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; }
    .domain span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .domain input { accent-color: #66d49e; }
    #status { margin-top: 10px; color: #9fd6b8; white-space: pre-wrap; }
    #status[data-error="true"] { color: #ff9a9a; }
    kbd { padding: 1px 5px; border: 1px solid rgb(255 255 255 / 24%); border-radius: 4px; background: #243c50; font: inherit; }
  </style>
</head>
<body>
  <div id="scene"></div>
  <aside id="panel" class="panel">
    <h1>Meadow Crossing</h1>
    <p class="subtitle">Independent clean-room scene · public npm APIs only</p>
    <div class="grid">
      <label for="backend">Backend</label><select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2 fallback</option></select>
      <label for="quality">Quality</label><select id="quality"><option value="balanced">Balanced</option><option value="performance">Performance</option></select>
      <label for="time">Lighting</label><select id="time"><option value="partly_cloudy">Partly Cloudy (11 AM)</option><option value="golden_hour">Golden Hour</option><option value="moonlit">Moonlit</option><option value="overcast">Overcast</option></select>
      <label for="character">Character</label><select id="character"><option value="glb">Mannequin GLB</option><option value="vrm">Mannequin VRM</option><option value="fbx">Mannequin FBX</option></select>
      <span>Bundle</span><strong>Call Me Sensei · strict</strong>
      <span>Package</span><strong id="package">—</strong>
    </div>
    <div id="domains" aria-label="Shader domains"></div>
    <div id="status">Starting…</div>
  </aside>
  <div id="controls" class="panel"><kbd>WASD</kbd> move · <kbd>Shift</kbd> sprint · <kbd>Space</kbd> jump/swim up · drag orbit</div>
  <script type="module" src="/scene-two.js"></script>
</body>
</html>
