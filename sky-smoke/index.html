<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M0 0H100V78L78 100H0Z' fill='%23e8332e'/%3E%3Ctext x='50' y='72' font-size='64' font-weight='900' font-family='Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif' fill='white' text-anchor='middle'%3E%E3%83%88%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Smoke Test — ToonLab</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; }
      /* The HUD is the only DOM the page owns, so `?hud=0` hiding it really does
         leave a canvas-only frame for the capture script to screenshot. */
      #hud {
        position: fixed; top: 10px; left: 10px; padding: 8px 10px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8eef7; background: rgba(8, 11, 16, 0.72);
        border: 1px solid rgba(232, 238, 247, 0.18); border-radius: 6px;
        white-space: pre; pointer-events: none;
      }
      #hud[hidden] { display: none; }
      #fail {
        position: fixed; inset: 0; display: none; place-content: center;
        padding: 6vh 8vw; overflow: auto;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #ffd9d5; background: #1a0b0b; white-space: pre-wrap;
      }
      body[data-sky-failed='true'] #fail { display: grid; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud">booting…</div>
    <div id="fail"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
